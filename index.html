
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Módulos VivaCocina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E8ECEC; --panel:#F8FAFA; --ink:#14232B; --ink2:#4C5E67; --line:#C9D2D4; --soft:#EEF2F2;
  --accent:#0B5C6B; --accent-ink:#FFFFFF; --warn:#B4531A; --ok:#2F7D4E;
  --dr-door:#F7F8F6; --dr-body:#DDE3E2; --dr-zoc:#3A4A52; --dr-niche:#2A3439; --dr-dim:#0B5C6B; --dr-line:#14232B; --dr-pan:#B7C3C6;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10181C; --panel:#17232A; --ink:#E6EDEF; --ink2:#9FB0B8; --line:#2B3B44; --soft:#1C2A32;
    --accent:#4FB3C7; --accent-ink:#08222A; --warn:#E39A63; --ok:#6CC08B;
    --dr-door:#22323A; --dr-body:#1B2A31; --dr-zoc:#0C1418; --dr-niche:#05090B; --dr-dim:#4FB3C7; --dr-line:#C9D6DB; --dr-pan:#41545C;
  }
}
:root[data-theme="dark"]{
  --bg:#10181C; --panel:#17232A; --ink:#E6EDEF; --ink2:#9FB0B8; --line:#2B3B44; --soft:#1C2A32;
  --accent:#4FB3C7; --accent-ink:#08222A; --warn:#E39A63; --ok:#6CC08B;
  --dr-door:#22323A; --dr-body:#1B2A31; --dr-zoc:#0C1418; --dr-niche:#05090B; --dr-dim:#4FB3C7; --dr-line:#C9D6DB; --dr-pan:#41545C;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif-condensed,sans-serif;font-weight:600;margin:0;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:2px 16px;padding:2px 14px}
.brand h1{font-size:15px;line-height:1.1}
.brand span{display:block;color:var(--ink2);font-size:10px}
body.has-cocinabar .brand span{display:none}
.tabs{display:flex;gap:1px;flex-wrap:wrap}
.sess{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:5px 10px;cursor:pointer;color:var(--ink2);font-weight:500;font-size:12.5px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1500px;margin:0 auto;padding:16px 20px 60px}
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:1100px){.split{grid-template-columns:minmax(0,1fr) 520px;align-items:start}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px}
.panel h2{font-size:22px;margin-bottom:8px}
.panel h3{font-size:18px;margin:14px 0 6px}
.bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 12px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--soft);border-radius:14px;padding:3px 11px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--soft);border-radius:5px;padding:7px 13px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:3px 9px;font-size:12px}
.btn.icon{padding:2px 8px}
table.t{width:100%;border-collapse:collapse}
table.t th{text-align:left;font-weight:500;color:var(--ink2);font-size:12px;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t .num{text-align:right;white-space:nowrap}
table.t .strong{font-weight:600}
table.t tr.on td{background:var(--soft)}
table.t tr[data-act="sel"]{cursor:pointer}
table.t tr[data-act="sel"]:hover td{background:var(--soft)}
table.t td.th{width:64px;padding:3px 8px}
td.code,.code{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:17px;white-space:nowrap}
.scroll{overflow-x:auto}
.dr{display:block;width:100%;height:auto}
.dr *{vector-effect:non-scaling-stroke}
.dr-body{fill:var(--dr-body);stroke:var(--dr-line);stroke-width:1.2}
.dr-body-line{fill:none;stroke:var(--dr-line);stroke-width:1.2}
.dr-door{fill:var(--dr-door);stroke:var(--dr-line);stroke-width:1.2}
.dr-zoc{fill:var(--dr-zoc);stroke:var(--dr-line);stroke-width:1}
.dr-niche{fill:var(--dr-niche);stroke:var(--dr-line);stroke-width:1.2}
.dr-pan{fill:var(--dr-pan);stroke:var(--dr-line);stroke-width:1}
.dr-nt{fill:#DDE6E8}
.dr-h{stroke:var(--dr-line);stroke-width:3;stroke-linecap:round}
.dr-open{stroke:var(--dr-line);stroke-width:.8;stroke-dasharray:6 5;fill:none;opacity:.7}
.dr-top{fill:var(--dr-pan);stroke:var(--dr-line);stroke-width:1}
.dr-floor{stroke:var(--dr-line);stroke-width:1.6}
.dr-dim line{stroke:var(--dr-dim);stroke-width:1}
.dr-dim text{fill:var(--dr-dim)}
.dr-lbl{fill:var(--ink2)}
.dr-ref{fill:var(--dr-door);stroke:var(--dr-line);stroke-width:1.2;stroke-dasharray:8 6}
.fig{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.fig figure{margin:0}
.fig figcaption{font-size:12px;color:var(--ink2);text-align:center}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:0}
dl.kv dt{color:var(--ink2)}
dl.kv dd{margin:0;text-align:right}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.head .code{font-size:34px;line-height:1}
.head p{margin:2px 0 0;color:var(--ink2)}
.tot td{font-weight:600;border-top:2px solid var(--ink)}
.small{font-size:12px;color:var(--ink2)}
.warn{color:var(--warn)}
.ok{color:var(--ok)}
.err{background:color-mix(in srgb,var(--warn) 14%,transparent);border:1px solid var(--warn);border-radius:5px;padding:8px 10px;margin:8px 0}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 14px;align-items:end}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink2)}
label.f input,label.f select,.inp{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:6px 8px;color:var(--ink);min-width:0;width:100%}
label.chk{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--ink)}
.props{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:12px}
.prop{border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--soft)}
.prop h3{margin:0 0 2px}
.prop .price{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:26px;font-weight:600}
.kpis{display:flex;flex-wrap:wrap;gap:8px 28px;margin:6px 0 10px}
.kpis div span{display:block;color:var(--ink2);font-size:12px}
.kpis div b{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:24px;font-weight:600}
textarea.out{width:100%;min-height:150px;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:8px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
select.slot{max-width:190px}
.pgs{display:flex;flex-direction:column;gap:18px;align-items:flex-start;overflow-x:auto;padding:4px 0 10px}

/* hoja A4 del catálogo (siempre clara, como papel) */
.sheet{--ink:#14232B;--ink2:#4C5E67;--line:#C9D2D4;--soft:#EEF2F2;--accent:#0B5C6B;--panel:#fff;
  --dr-door:#F7F8F6;--dr-body:#DDE3E2;--dr-zoc:#3A4A52;--dr-niche:#2A3439;--dr-dim:#0B5C6B;--dr-line:#14232B;--dr-pan:#B7C3C6;
  width:210mm;height:297mm;flex:none;background:#fff;color:var(--ink);padding:10mm 12mm;box-shadow:0 1px 8px rgba(0,0,0,.25);
  display:flex;flex-direction:column;overflow:hidden;font-size:9.5pt;line-height:1.35}
.sheet .sh{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:3mm;margin-bottom:4mm}
.sheet .sh b{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:14pt;font-weight:600}
.sheet .sh span{color:var(--ink2);font-size:8.5pt}
.sheet .big{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:34pt;font-weight:600;line-height:1}
.sheet h4{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:12pt;font-weight:600;margin:4mm 0 1.5mm;border-bottom:1px solid var(--line);padding-bottom:1mm}
.sheet table{width:100%;border-collapse:collapse;font-size:8pt}
.sheet th{text-align:left;font-weight:500;color:var(--ink2);padding:1mm 1.5mm;border-bottom:1px solid var(--ink)}
.sheet td{padding:.55mm 1.5mm;border-bottom:1px solid var(--line)}
.sheet .num{text-align:right}
.sheet .cols{display:grid;grid-template-columns:1fr 1fr;gap:6mm}
.sheet .figs{display:grid;grid-template-columns:1.1fr 1fr;gap:6mm;align-items:end;height:66mm}
.sheet .figs svg{height:64mm;width:100%}
.sheet .foot{margin-top:auto;padding-top:3mm;border-top:1px solid var(--line);font-size:8pt;color:var(--ink2);display:flex;justify-content:space-between}
.sheet.cover{justify-content:space-between}
.sheet.cover .title{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:54pt;font-weight:600;line-height:.95;margin-top:40mm}
.sheet.cover .sub{font-size:14pt;color:var(--ink2);margin-top:6mm}
#printRoot{display:none}
.work{display:grid;gap:12px;grid-template-columns:minmax(0,1fr);margin-top:12px}
.workspace{position:relative;margin-top:10px}
@media (min-width:1200px){.work{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
.acc{margin-top:12px;padding:0}
.acc-h{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:0;padding:12px 14px;cursor:pointer;font:600 20px "Barlow Condensed","Arial Narrow",sans-serif;text-align:left;color:var(--ink)}
.acc-b{padding:0 14px 14px}
.selbar{margin-top:12px}
.selbar .code{font-size:22px}
.trash{margin-top:8px;border:1.5px dashed var(--line);border-radius:6px;padding:8px;text-align:center;color:var(--ink2);font-size:12px}
.trash.over{border-color:var(--warn);color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.btn.danger{border-color:var(--warn);color:var(--warn)}
.elevblock{margin-bottom:12px}
.el-g{cursor:pointer}
.el-hit{fill:transparent;stroke:none;pointer-events:all}
.el-sel{stroke:var(--accent);stroke-width:4;fill:color-mix(in srgb,var(--accent) 10%,transparent)}
.pl-band{fill:var(--accent);opacity:.14;pointer-events:none}
.pl-led{stroke:#E8A800;stroke-width:4;fill:none}
#ovl{display:none}
body.has-ovl #ovl{display:block;position:fixed;inset:0;z-index:80;background:var(--bg);overflow:auto}
.ovl-bar{position:sticky;top:0;z-index:2;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.sheet{--warn:#B4531A}
.sheet .elevblock svg{width:100%;height:auto;max-height:112mm}
.sheet .elevblock h4{margin-top:2mm}
.pal{display:flex;flex-wrap:wrap;gap:6px}
.pal-item{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;border:1px solid var(--line);background:var(--soft);border-radius:5px;padding:4px 9px;font-size:12px}
.pal-item:hover{border-color:var(--accent)}
.ghost{position:fixed;z-index:60;pointer-events:none;padding:4px 10px;background:var(--accent);color:var(--accent-ink);border-radius:5px;font-size:12px;font-weight:600;opacity:.92}
.pl-g{touch-action:none}
.dr-app{fill:none;stroke:var(--dr-line);stroke-width:1.6}
.pl-drag{opacity:.3}
.mec-grid{stroke:var(--line);stroke-width:.6;opacity:.7}
.mec-h circle{fill:color-mix(in srgb,var(--accent) 18%,transparent);stroke:var(--dr-line);stroke-width:1.2;cursor:grab}
.mec-h line{stroke:var(--dr-line);stroke-width:.8;opacity:.6;pointer-events:none}
.mec-h.sel circle{stroke:var(--accent);stroke-width:2.4;fill:color-mix(in srgb,var(--accent) 35%,transparent)}
svg.mec{touch-action:none;max-height:60vh}
.cocina-app{display:flex;flex-direction:column;min-height:0}
.cocinabar{width:100%;order:99;display:flex;flex-direction:column;border-top:1px solid var(--line);margin-top:1px}
.cocina-head{display:flex;flex-wrap:wrap;align-items:center;gap:3px 10px;padding:1px 4px}
.hstat{font-size:10.5px;color:var(--ink2);white-space:nowrap}
.hstat b{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:14px;color:var(--ink);margin-left:3px;font-weight:600}
.cocinabar .fdock{padding:0;gap:4px}
.cad{display:grid;grid-template-columns:220px minmax(0,1fr) 250px;gap:10px;align-items:start;margin-top:0;border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--bg)}
@media (max-width:960px){.cad{grid-template-columns:1fr}}
@media (min-width:961px){
  .cocina-app{height:calc(100dvh - var(--headH,130px));margin:-16px -20px -60px;padding:6px 20px 0}
  .cad{flex:1;min-height:0;overflow:hidden}
  .cad-lib,.cad-sel{height:100%;max-height:none}
  .cad-canvas{height:100%;display:flex;flex-direction:column;min-height:0}
  .cad-canvas .wtoolbar{flex:none;margin-top:4px;margin-bottom:0}
  .cad-canvas .zoomwrap{flex:1;min-height:0;overflow:auto}
}
.cad-lib,.cad-sel{position:sticky;top:64px;max-height:calc(100vh - 90px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;min-height:0}
.cad-rail{position:sticky;top:64px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 2px;background:var(--soft);border:1px solid var(--line);border-radius:6px;height:100%}
.rail-lbl{writing-mode:vertical-rl;text-orientation:mixed;font-size:11px;color:var(--ink2);white-space:nowrap}
.statusbar{flex:none;display:flex;gap:14px;padding:2px 10px;border-top:1px solid var(--line);background:var(--soft);font-size:10px;color:var(--ink2);line-height:1.4}
@media (max-width:960px){.cad-lib,.cad-sel{position:static;max-height:none}}
.cad-canvas{min-width:0}
.lib-scroll{max-height:calc(100vh - 170px);overflow:auto;min-height:0}
.lib-grp{border-bottom:1px solid var(--line)}
.lib-h{width:100%;text-align:left;background:none;border:0;padding:6px 2px;cursor:pointer;font-weight:600;color:var(--ink)}
.lib-list{display:flex;flex-direction:column;gap:2px;padding-bottom:6px}
.lib-row{display:flex;align-items:center;gap:8px;padding:4px 4px;border-radius:5px;cursor:grab}
.lib-row:hover{background:var(--soft)}
.lib-th{flex:none;width:34px}
.lib-th svg{max-height:34px;max-width:34px}
.lib-tx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.lib-pr{flex:none;color:var(--ink2)}
.wtoolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.wtoolbar .seg button{padding:3px 9px;font-size:12px}
.wtoolbar .btn.small{padding:2px 8px}
.zoomwrap{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px}
.zoomin{min-width:min-content}
.cad-acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cad-acts .btn{width:100%}
.btn.danger{border-color:var(--warn);color:var(--warn)}
.pl-ind{stroke:var(--accent);stroke-width:5;stroke-linecap:round;pointer-events:none}
.fdock{display:flex;flex-wrap:wrap;gap:4px;padding:3px 6px;z-index:3;min-height:0}
.fdock-b{padding:2px 10px;height:22px;line-height:18px;border-radius:5px;border:1px solid var(--line);background:var(--soft);cursor:pointer;font-size:11px;color:var(--ink)}
.fdock-b.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fdock-b:hover{border-color:var(--ink2)}
.fpanel{position:fixed;z-index:40;width:380px;max-width:92vw;max-height:78vh;display:flex;flex-direction:column;background:color-mix(in srgb,var(--panel) 97%,transparent);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.fpanel-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);cursor:grab;font-weight:600;background:var(--soft);border-radius:8px 8px 0 0;touch-action:none;user-select:none}
.fpanel-h .code{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:18px}
.fpanel-b{padding:10px;overflow:auto}
@media (max-width:680px){.fdock-b{flex:1 1 30%}.fpanel{left:4px!important;right:4px;width:auto!important;max-width:none}}
.grid-mat{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px;margin-top:10px}
.mcard{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--soft);display:flex;flex-direction:column}
.mcard.on{outline:2px solid var(--accent)}
.mcard .sw{height:104px;background-size:cover;background-position:center;border-bottom:1px solid var(--line)}
.mcard .bd{padding:8px;display:flex;flex-direction:column;gap:2px;font-size:12px;flex:1}
.mcard .nm{font-weight:600;font-size:13px}
.mcard .ac{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto;padding-top:6px}
.pl-wall{fill:var(--dr-line)}
.pl-floor{fill:var(--panel)}
.pl-mod{stroke:var(--dr-line);stroke-width:1.4}
.pl-tall{fill:var(--dr-pan);stroke:var(--dr-line);stroke-width:1.4}
.pl-ref{fill:none;stroke:var(--dr-line);stroke-width:1.2;stroke-dasharray:10 7}
.pl-aer{fill:none;stroke:var(--dr-line);stroke-width:1;stroke-dasharray:12 8;opacity:.75}
.pl-front{stroke:var(--dr-line);stroke-width:3}
.pl-sym{fill:none;stroke:var(--dr-line);stroke-width:1.2}
.pl-door,.pl-win{stroke:var(--dr-line);stroke-width:1.4;fill:none}
.pl-sel{stroke:var(--accent)!important;stroke-width:4!important}
.pl-g{cursor:pointer}
svg.pl{max-height:78vh}
.sheet .planwrap svg{width:100%;height:auto;max-height:130mm}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff}
  #app{display:none!important}
  #printRoot{display:block}
  #printRoot .sheet,#ovl .sheet{box-shadow:none;break-after:page;page-break-after:always;margin:0}
  body.has-ovl #ovl{position:static;overflow:visible;background:#fff;display:block}
  #ovl .ovl-bar,#ovl>p{display:none}
  #ovl .pgs{display:block;padding:0!important;overflow:visible}
  :root,:root:not([data-theme="light"]),:root[data-theme="dark"]{padding:0}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><h1>Módulos VivaCocina</h1><span>Biblioteca, catálogo y cocinas armadas con módulos</span></div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div class="sess" id="sess"></div>
    <div class="cocinabar" id="cocinabar"></div>
  </header>
  <main class="wrap" id="view"></main>
</div>
<div id="printRoot"></div>
<div id="ovl"></div>

function costModule(M){
  const A={C:0,F:0,B:0};let cFino=0,cGrueso=0,pcs=0;
  for(const p of M.parts){
    A[p.mat]+=p.q*p.l*p.w/1e6;
    const len=p.q*(p.eL*p.l+p.eA*p.w)/1000;
    if(p.mat==='F')cGrueso+=len;else cFino+=len;
    pcs+=p.q;
  }
  const mm=M.mats||{};
  const materiales=(A.C*pm2('C',mm.C)+A.F*pm2('F',mm.F)+A.B*pm2('B',mm.B))*(1+PR.merma);
  const cFinoM=cFino*(1+PR.canto.merma),cGruesoM=cGrueso*(1+PR.canto.merma);
  const pFino=cantoSel('fino'),pGrueso=cantoSel('grueso');
  const tapacanto=cFinoM*(pFino?pFino.precio:120)+cGruesoM*(pGrueso?pGrueso.precio:380);
  const canto=cFino+cGrueso,cantoM=cFinoM+cGruesoM;
  let herrajes=0,hn=0;
  herrLines(M).forEach(l=>{herrajes+=l.q*l.precio;if(!['pata','soporte','confirmat','tarugo','tornbis','torncor','clavofondo','tornpata','torntir','insumos'].includes(l.k))hn+=l.q;});
  const mo=(pcs*PR.mo.minPieza+hn*PR.mo.minHerraje)/60*PR.mo.valorHora;
  const costo=materiales+tapacanto+herrajes+mo;
  return {area:A,areaTotal:A.C+A.F,canto,cantoM,cFino,cGrueso,cFinoM,cGruesoM,pcs,materiales,tapacanto,herrajes,mo,costo,precio:costo*(1+PR.margen)};
}

function sumH(herr,prefix){
  let s=0;for(const k in herr)if(k===prefix||k.indexOf(prefix+':')===0)s+=herr[k];return s;
}
function addTornilleria(hw,parts,herr){
  const fixedRe=/^(Piso|Techo|Travesaño|Divisor|Frontal sobre horno)/;
  let uniones=0;
  parts.forEach(p=>{if(fixedRe.test(p.n))uniones+=p.q*2;});
  hw('confirmat',uniones);
  hw('tarugo',uniones);
  hw('tornbis',sumH(herr,'bisagra')*4);
  hw('torncor',sumH(herr,'corredera')*8);
  let clavo=0;
  parts.forEach(p=>{if(p.mat==='B')clavo+=p.q*Math.ceil(2*(p.l+p.w)/100);});
  hw('clavofondo',clavo);
  hw('tornpata',(herr.pata||0)*2);
  hw('torntir',sumH(herr,'tirador')*2);
  hw('insumos',1);
}

function fillDP(len,costFn){
  const Ws=FAM.BA.widths.filter(w=>w%10===0);
  const u=Math.floor(len/10);
  const best=new Array(u+1).fill(Infinity),prev=new Array(u+1).fill(-1);best[0]=0;
  for(let x=1;x<=u;x++)for(const w of Ws){const k=w/10;if(x>=k&&best[x-k]+costFn(w)<best[x]){best[x]=best[x-k]+costFn(w);prev[x]=w;}}
  let x=u;while(x>0&&!isFinite(best[x]))x--;
  const ws=[];let c=x;while(c>0){ws.push(prev[c]);c-=prev[c]/10;}
  ws.sort((a,b)=>b-a);
  return {ws,sum:x*10};
}

}
function combos(lists,cap){

function propose(g,st){

    const mu=tipo.muros[mi],len=+(g.L&&g.L[mi])||0,usable=len-(mu.desc?D:0);
    if(usable<300)return {error:'El '+mu.nombre.toLowerCase()+' es muy corto: quedan '+fmtI(Math.max(usable,0))+' mm útiles.'};
    const items=[];
    for(const it of mu.items){
      if(it.k==='REF'){if(g.ref>0)items.push({k:'REF',w:+g.ref});continue;}
      if(it.k==='FILL'){items.push({k:'FILL',peso:Math.max(1,+it.peso||1)});continue;}
      if(it.k==='MOD'){
        const r=resolveMod(it,v);
        const nombres=(it.fams||[]).map(f=>FAM[f]?FAM[f].nombre.toLowerCase():f).join(' o ');
        if(!r){
          if(it.req===false){notas.push(mu.nombre+': se omitió '+nombres+' porque no existe para '+v+'.');continue;}
          return {error:'En el '+mu.nombre.toLowerCase()+' la regla pide '+nombres+', pero no existe para la altura '+v+'. Cambia la altura o la regla.'};
        }
        if(r.fell)notas.push(mu.nombre+': el '+FAM[it.fams[0]].nombre.toLowerCase()+' no existe para '+v+'; se usó '+FAM[r.fam].nombre.toLowerCase()+'.');
        let pref=+it.pref||r.widths[0];
        if(r.fam==='LA'&&g.lav&&r.widths.includes(+g.lav))pref=+g.lav;
        if(!r.widths.includes(pref))pref=r.widths.reduce((a,b)=>Math.abs(b-pref)<Math.abs(a-pref)?b:a);
        items.push({k:'MOD',fam:r.fam,widths:r.widths,pref});
      }
    }
    const modIdx=items.map((it,ix)=>it.k==='MOD'?ix:-1).filter(ix=>ix>=0);
    const lists=modIdx.map(ix=>items[ix].widths.slice().sort((a,b)=>Math.abs(a-items[ix].pref)-Math.abs(b-items[ix].pref)).slice(0,4));
    const fixedRef=items.filter(it=>it.k==='REF').reduce((a,it)=>a+it.w,0);
    const fills=items.filter(it=>it.k==='FILL');
    const ptot=fills.reduce((a,it)=>a+it.peso,0);
    let best=null,minNeed=fixedRef;
    modIdx.forEach(ix=>{minNeed+=Math.min(...items[ix].widths);});
    for(const cb of combos(lists,600)){
      const fixed=fixedRef+cb.reduce((a,w)=>a+w,0),free=usable-fixed;
      if(free<0)continue;
      let segs=[],rem=free,nmods=cb.length;
      if(fills.length){
        let carry=0,alloc=0;
        fills.forEach((f,fi)=>{
          const L=fi===fills.length-1?free-alloc:Math.floor(free*f.peso/ptot/10)*10;
          alloc+=L;
          const r=fillDP(L+carry,st.cost);segs.push(r.ws);carry=L+carry-r.sum;nmods+=r.ws.length;
        });
        rem=carry;
      }
      const dev=cb.reduce((a,w,k)=>a+Math.abs(w-items[modIdx[k]].pref),0)/100;
      const score=(rem>=10?30+rem/10:0)+nmods*10+dev*25;
      if(!best||score<best.score)best={score,cb,segs,rem};
    }
    if(!best)return {error:'En el '+mu.nombre.toLowerCase()+' no caben los módulos de la regla: se necesitan al menos '+fmtI(minNeed)+' mm y hay '+fmtI(usable)+' mm útiles.'};
    const slots=[];let mk=0,fk=0;
    for(const it of items){
      if(it.k==='REF')slots.push({b:'REF-'+it.w,a:null});
      else if(it.k==='MOD'){
        const w=best.cb[mk++];
        slots.push({b:it.fam+'-'+w+'-'+famVar(it.fam,v),a:null});
        if(w!==it.pref)notas.push(mu.nombre+': '+FAM[it.fam].nombre+' '+(w>it.pref?'ensanchado':'angostado')+' a '+w+' mm (preferido '+it.pref+' mm) para que el muro calce.');
      }else best.segs[fk++].forEach(w=>slots.push({b:codeFor(w),a:null}));
    }
    if(best.rem>=10){slots.push({b:'RL-'+best.rem+'-'+v,a:null});notas.push(mu.nombre+': queda un relleno de '+best.rem+' mm.');}
    runs.push({label:mu.nombre,length:usable,slots,wall:mu.pared||['N','O','E','S'][mi]});
  }
  if(g.aereos)runs.forEach(run=>run.slots.forEach(sl=>{
    const m=getItem(sl.b);
    if(m&&['BA','CA','LA'].includes(m.fam)&&BY['AE-'+m.W+'-A70'])sl.a='AE-'+m.W+'-A70';
    if(m&&m.fam==='CO'&&g.campana!==false&&BY['CM-'+m.W+'-A35'])sl.a='CM-'+m.W+'-A35';
  }));
  return {runs,variant:v,notas};
}

function isTall(m){return !!m&&m.kind==='torre';}
function kitchenTotals(k){
  let modulos=0,ml=0,mlAereo=0,n=0;
  k.runs.forEach(r=>r.slots.forEach(s=>{
    const b=getItem(s.b);
    if(b&&b.kind!=='ref'){modulos+=priceOf(b);n++;if(!isTall(b))ml+=b.W/1000;}
    const a=getItem(s.a);if(a){modulos+=priceOf(a);n++;if(a.kind==='aereo')mlAereo+=a.W/1000;}
  }));
  const RR=(k&&k.rec)||(typeof K!=='undefined'&&K&&K.rec)||{};
  let ledMl=0,led=0;
  if(RR.led!==false){
    k.runs.forEach(r=>{
      let m2=0;
      r.slots.forEach(s=>{const a=getItem(s.a);if(a&&a.kind==='aereo'&&a.fam!=='CM'&&a.fam!=='ML')m2+=a.W/1000;});
      if(m2>0){const pl=herrItem('led'),pf=herrItem('fuenteled');ledMl+=m2;led+=m2*(pl?pl.precio:9500)+Math.ceil(m2/4)*(pf?pf.precio:14000);}
    });
  }
  const cub=ml*PR.extras.cubierta,zoc=ml*PR.extras.zocalo,ins=ml*PR.extras.instalacion;
  let art=0;((k&&k.artefactos)||[]).forEach(a=>{if(a.incluir!==false)art+=(+a.precio||0);});
  const sub=modulos+cub+zoc+ins+led+art;
  return {modulos,ml,mlAereo,n,cub,zoc,ins,led,ledMl,art,sub,iva:sub*PR.iva,total:sub*(1+PR.iva)};
}
function cutRows(k){
  const cnt={};
  k.runs.forEach(r=>r.slots.forEach(s=>{[s.b,s.a].forEach(c=>{const m=getItem(c);if(m&&m.kind!=='ref')cnt[c]=(cnt[c]||0)+1;});}));

}

      const b=vref.b,a=vref.a,mesa=b.H+R.cubierta,bot=aerBottom(b,a);
      s+=dimSegV(lx,Y(0),Y(mesa),fmtI(mesa),dfs);
      s+=dimSegV(lx,Y(mesa),Y(bot),fmtI(bot-mesa),dfs);
      s+=dimSegV(lx,Y(bot),Y(bot+a.H),fmtI(a.H),dfs);
    }
    s+=dimSegV(-fs*6.2,Y(0),Y(R.alto),fmtI(R.alto),dfs);
    // derecha: refrigerador y maleiro
    if(refSlot){
      const rx=len+fs*2.4;
      s+=dimSegV(rx,Y(0),Y(R.refAlto),fmtI(R.refAlto),dfs);
      if(refAp)s+=dimSegV(rx,Y(refAp.bot),Y(refAp.bot+refAp.a.H),fmtI(refAp.a.H),dfs);
    }
    if(R.led&&ledMl>0)s+=`<text class="dr-lbl" x="0" y="${ROOM+fs*7.2}" font-size="${Math.round(fs*.8)}">Iluminación LED bajo los aéreos: ${fmtN(ledMl,2)} m</text>`;
  }
  return s+'</svg>';
}

/* ---- mecanizado: perforaciones por sistema 32 ---- */
function hingePositions(doorH){
  const n=hingesFor(doorH);
  if(n<=1)return [Math.round(doorH/2)];
  const first=Math.min(CFG.mec.bisagraEdge,Math.max(30,doorH*0.12));
  const last=doorH-first;
  const arr=[];for(let i=0;i<n;i++)arr.push(Math.round(first+(last-first)*i/(n-1)));
  return arr;
}
function autoHolesAll(M){
  const mec=CFG.mec,out={},t=M.custom?(M.t||CFG.t):CFG.t;
  (M.parts||[]).forEach((part,idx)=>{
    const n=part.n;let hs=[];
    if(n==='Lateral'){
      const D=part.w;
      if(M.shelfY&&M.shelfY.length){
        const y0=mec.shelfMargin,y1=part.l-mec.shelfMargin;
        for(let y=y0;y<=y1;y+=32){
          hs.push({x:mec.front,y:Math.round(y),d:mec.pinD,depth:12,t:'soporte de balda'});
          hs.push({x:Math.max(mec.front+20,D-mec.back),y:Math.round(y),d:mec.pinD,depth:12,t:'soporte de balda'});
        }
      }
      const camY=new Set();
      (M.front||[]).filter(e=>e.k==='door').forEach(e=>{
        const ly=e.y-(M.zoc||0);
        hingePositions(e.h).forEach(off=>{
          const y=Math.round(ly+off);
          if(y>=0&&y<=part.l&&!camY.has(y)){camY.add(y);hs.push({x:mec.front,y,d:mec.camD,depth:13,t:'bisagra: contraplaca'});}
        });
      });
    }else if(/^Puerta/.test(n)&&part.mat==='F'){
      const ref=(M.front||[]).find(e=>e.k==='door'&&Math.abs(e.h-part.l)<1&&Math.abs(e.w-part.w)<1);
      const side=ref?ref.hinge:'L';
      if(side==='L'||side==='R'){
        const ex=side==='L'?part.w-mec.bisagraOffset:mec.bisagraOffset;
        hingePositions(part.l).forEach(y=>{hs.push({x:Math.round(ex),y,d:mec.cupD,depth:mec.cupDepth,t:'bisagra: cazoleta'});});
        if(sumH(M.herr||{},'tirador')>0){
          const tx=side==='L'?mec.bisagraOffset+8:part.w-mec.bisagraOffset-8,cy=Math.round(part.l/2);
          hs.push({x:Math.round(tx),y:Math.max(20,Math.round(cy-mec.tiradorCentro/2)),d:mec.pilotD,depth:12,t:'tirador'});
          hs.push({x:Math.round(tx),y:Math.min(part.l-20,Math.round(cy+mec.tiradorCentro/2)),d:mec.pilotD,depth:12,t:'tirador'});
        }
      }
    }else if(/^Costado cajón/.test(n)){
      hs=[
        {x:20,y:15,d:mec.pilotD,depth:10,t:'corredera'},{x:20,y:Math.max(15,part.w-15),d:mec.pilotD,depth:10,t:'corredera'},
        {x:Math.max(20,part.l-20),y:15,d:mec.pilotD,depth:10,t:'corredera'},{x:Math.max(20,part.l-20),y:Math.max(15,part.w-15),d:mec.pilotD,depth:10,t:'corredera'}
      ];
    }else if(/^(Piso|Techo|Travesaño|Divisor|Frontal sobre horno)/.test(n)){
      const cy=Math.round(part.w/2);
      hs=[
        {x:mec.confirmatOffset,y:cy,d:mec.confirmatD,depth:t,t:'confirmat pasante'},
        {x:Math.max(mec.confirmatOffset,part.l-mec.confirmatOffset),y:cy,d:mec.confirmatD,depth:t,t:'confirmat pasante'}
      ];
    }
    if(hs.length)out[idx]=hs;
  });
  return out;
}
function partHoles(M,idx){
  const key=M.code+'|'+idx;
  const ov=CFG.mecOverrides&&CFG.mecOverrides[key];
  if(ov)return ov;
  return autoHolesAll(M)[idx]||[];
}
function holeSVG(M,idx){
  const part=M.parts[idx],holes=partHoles(M,idx);
  const w=part.l,h=part.w,pad={l:34,r:16,t:16,b:30};
  const fs=Math.max(11,Math.min(20,Math.round(Math.max(w,h)/40)));
  let s=`<svg class="dr mec" id="mec-svg" viewBox="${-pad.l} ${-pad.t} ${w+pad.l+pad.r} ${h+pad.t+pad.b}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Perforaciones de ${esc(part.n)}">`;
  s+=`<rect x="0" y="0" width="${w}" height="${h}" class="dr-body-line"/>`;
  if(S.mecGrid!==false){
    for(let x=0;x<=w;x+=32)s+=`<line x1="${x}" y1="0" x2="${x}" y2="${h}" class="mec-grid"/>`;
    for(let y=0;y<=h;y+=32)s+=`<line x1="0" y1="${y}" x2="${w}" y2="${y}" class="mec-grid"/>`;
  }
  holes.forEach((ho,i)=>{
    const sel=S.mecSel===i,r=Math.max(2,ho.d/2);
    s+=`<g class="mec-h${sel?' sel':''}" data-act="mecSelHole" data-i="${i}" tabindex="0" role="button" aria-label="Orificio ${i+1}, ${esc(ho.t||'')}, ${ho.d} mm"><circle cx="${ho.x}" cy="${ho.y}" r="${r}"/><line x1="${ho.x-r-2}" y1="${ho.y}" x2="${ho.x+r+2}" y2="${ho.y}"/><line x1="${ho.x}" y1="${ho.y-r-2}" x2="${ho.x}" y2="${ho.y+r+2}"/></g>`;
  });
  s+=dimH(0,w,h+pad.b*.7,fmtI(w),fs);
  s+=dimV(-pad.l*.7,0,h,fmtI(h),fs);
  return s+'</svg>';
}

/* ---- recinto y aéreos ---- */
function REC(){
  if(!K.rec)K.rec={alto:2400,cubierta:38,libre:600,libreCampana:700,cielo:false,luzCielo:20};
  const R=K.rec;
  if(!(R.alto>0))R.alto=2400;
  if(R.cubierta==null)R.cubierta=38;
  if(!(R.libre>0))R.libre=600;
  if(!(R.libreCampana>0))R.libreCampana=700;
  if(R.luzCielo==null)R.luzCielo=20;
  if(R.led===undefined)R.led=true;
  if(!(R.refAlto>0))R.refAlto=1800;
  if(R.maleiro===undefined)R.maleiro=false;
  return R;
}
function aerBottom(b,a){
  const R=REC();
  if(b&&b.kind==='ref')return R.refAlto;
  return ((b&&b.H)?b.H:800)+R.cubierta+((a&&a.fam==='CM')?R.libreCampana:R.libre);
}
function aerKey(h){const hh=Math.max(200,Math.floor(h/10)*10);const key='A'+(hh/10);VAR_H[key]=hh;return key;}
function fixAer(){
  const R=REC();
  K.runs.forEach(r=>r.slots.forEach(sl=>{
    if(!sl.a)return;
    const p=sl.a.split('-');
    if(p[0]!=='AE')return;
    const b=getItem(sl.b);
    if(R.cielo){
      const h=R.alto-aerBottom(b,null)-R.luzCielo;
      if(h>=200)sl.a='AE-'+p[1]+'-'+aerKey(h);
    }else if(p[2]!=='A70'&&p[2]!=='A90')sl.a='AE-'+p[1]+'-A70';
  }));
  K.runs.forEach(r=>r.slots.forEach(sl=>{
    const b=getItem(sl.b);
    if(!b||b.kind!=='ref')return;
    if(R.maleiro&&FAM.ML){
      const h=R.alto-R.refAlto-R.luzCielo,ws=FAM.ML.widths;
      if(h>=200&&ws.length){const w=ws.reduce((x,c)=>Math.abs(c-b.W)<Math.abs(x-b.W)?c:x);sl.a='ML-'+w+'-'+aerKey(h);}
      else sl.a=null;
    }else if(sl.a&&sl.a.startsWith('ML-'))sl.a=null;
  }));
}
function aerWarnings(){
  const R=REC(),out=[];
  K.runs.forEach(r=>r.slots.forEach(s=>{
    const b=getItem(s.b),a=getItem(s.a);if(!b||!a)return;
    const top=aerBottom(b,a)+a.H;
    if(top>R.alto)out.push(r.label+' · '+a.code+': sobrepasa el cielo raso por '+fmtI(top-R.alto)+' mm.');
    if(a.H<250)out.push(a.code+': quedó muy bajo ('+a.H+' mm).');
  }));
  return [...new Set(out)];
}

  const chk=(lab,key)=>`<label class="chk"><input type="checkbox" data-bind="recChk" data-k="${key}"${R[key]?' checked':''}>${lab}</label>`;
  const mesa=bh+R.cubierta,bot=mesa+R.libre,botC=mesa+R.libreCampana;

      ${R.cielo?f('Luz al cielo raso (mm)','luzCielo','min="0" max="200" step="5"'):''}

function fileToThumb(file,max){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(fr.error||new Error('No se pudo leer el archivo'));
    fr.onload=()=>{
      const im=new Image();
      im.onerror=()=>rej(new Error('El archivo no es una imagen válida'));
      im.onload=()=>{
        const k=Math.min(1,max/Math.max(im.width,im.height));
        const c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',0.78));
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

}

function wallOf(r,i){return r.wall||WALL_AUTO[i]||'N';}
function runUsed(r){let u=0;r.slots.forEach(s=>{const b=getItem(s.b);if(b)u+=b.W;});return u;}
function roomDefaults(){
  const D=CFG.prof.base;let lx=0,ly=0,ns=0,eo=0;const ws=[];
  K.runs.forEach((r,i)=>{
    const w=wallOf(r,i);ws.push(w);
    const u=Math.max(runUsed(r),r.length||0);
    if(w==='N'||w==='S'){lx=Math.max(lx,u);ns++;}else{ly=Math.max(ly,u+D);eo++;}
  });
  if(!lx)lx=2400+(eo?D:0);
  if(!ly)ly=Math.max(2400,D+1500);
  if(ns>1)ly=Math.max(ly,2*D+1200);
  if(eo>1)lx=Math.max(lx,2*D+1200);
  const free=['S','E','O','N'].find(p=>!ws.includes(p))||'S';
  let u=300;
  if((free==='N'||free==='S')&&ws.includes('O'))u=D+150;
  if((free==='E'||free==='O')&&ws.includes('N'))u=D+150;
  return {lx:Math.round(lx),ly:Math.round(ly),ab:[{t:'puerta',p:free,u,a:800}]};
}
function localToXY(w,u,v,room){
  if(w==='N')return [u,v];
  if(w==='S')return [u,room.ly-v];
  if(w==='O')return [v,u];
  return [room.lx-v,u];
}
function planRects(room){
  const D=CFG.prof.base,out=[];
  const walls=K.runs.map((r,i)=>wallOf(r,i));
  const hasN=walls.includes('N');
  K.runs.forEach((r,ri)=>{
    const w=walls[ri];
    let acc=(r.off!=null&&r.off!=='')?+r.off:((w==='O'||w==='E')&&hasN?D:0);
    r.slots.forEach((sl,si)=>{
      const b=getItem(sl.b);if(!b)return;
      const dep=b.kind==='ref'?700:D,bw=b.W;
      let x,y,rw,rh;
      if(w==='N'){x=acc;y=0;rw=bw;rh=dep;}
      else if(w==='S'){x=acc;y=room.ly-dep;rw=bw;rh=dep;}
      else if(w==='O'){x=0;y=acc;rw=dep;rh=bw;}
      else{x=room.lx-dep;y=acc;rw=dep;rh=bw;}
      out.push({r:ri,s:si,x,y,w:rw,h:rh,wall:w,item:b,a:getItem(sl.a)});
      acc+=bw;
    });
  });
  return out;
}
function textOn(hex){
  const h=String(hex||'#ffffff').replace('#','');
  const n=h.length===3?h.split('').map(c=>c+c).join(''):h;
  const r=parseInt(n.slice(0,2),16)||0,g=parseInt(n.slice(2,4),16)||0,b=parseInt(n.slice(4,6),16)||0;
  return (0.299*r+0.587*g+0.114*b)>150?'#14232B':'#F4F7F8';
}
function openingSVG(ab,room){
  const w=ab.p,u=+ab.u,a=+ab.a,T=120;
  const P=(uu,vv)=>localToXY(w,uu,vv,room);
  const c1=P(u,-T),c2=P(u+a,0);
  const x=Math.min(c1[0],c2[0]),y=Math.min(c1[1],c2[1]),cw=Math.abs(c1[0]-c2[0]),ch=Math.abs(c1[1]-c2[1]);
  let s=`<rect class="pl-floor" x="${x}" y="${y}" width="${cw}" height="${ch}"/>`;
  if(ab.t==='ventana'){
    [0.3,0.7].forEach(f=>{const p1=P(u,-T*f),p2=P(u+a,-T*f);s+=`<line class="pl-win" x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}"/>`;});
    const q1=P(u,-T),q2=P(u,0),q3=P(u+a,-T),q4=P(u+a,0);
    s+=`<line class="pl-win" x1="${q1[0]}" y1="${q1[1]}" x2="${q2[0]}" y2="${q2[1]}"/><line class="pl-win" x1="${q3[0]}" y1="${q3[1]}" x2="${q4[0]}" y2="${q4[1]}"/>`;
  }else{
    const h=P(u,0),e=P(u,a),f=P(u+a,0),sweep=(w==='S'||w==='O')?0:1;
    s+=`<line class="pl-door" x1="${h[0]}" y1="${h[1]}" x2="${e[0]}" y2="${e[1]}"/><path class="pl-door" d="M${f[0]} ${f[1]} A${a} ${a} 0 0 ${sweep} ${e[0]} ${e[1]}"/>`;
  }
  return s;
}
function planSym(rc){
  const it=rc.item,horiz=(rc.wall==='N'||rc.wall==='S');
  const cx=rc.x+rc.w/2,cy=rc.y+rc.h/2,along=horiz?rc.w:rc.h,across=horiz?rc.h:rc.w;
  if(it.fam==='LA'){
    const a=along*.62,b=across*.5,w=horiz?a:b,h=horiz?b:a;
    return `<rect class="pl-sym" rx="30" x="${+(cx-w/2).toFixed(1)}" y="${+(cy-h/2).toFixed(1)}" width="${+w.toFixed(1)}" height="${+h.toFixed(1)}"/>`;
  }
  if(it.fam==='CO'){
    const dx=along*.22,dy=across*.2,r=Math.min(along,across)*.11;let s='';
    for(const i of [-1,1])for(const j of [-1,1]){
      const px=horiz?cx+i*dx:cx+j*dy,py=horiz?cy+j*dy:cy+i*dx;
      s+=`<circle class="pl-sym" cx="${+px.toFixed(1)}" cy="${+py.toFixed(1)}" r="${+r.toFixed(1)}"/>`;
    }
    return s;
  }
  return '';
}

function plantaSVG(o){

  s+=`<rect class="pl-wall" x="${-T}" y="${-T}" width="${lx+2*T}" height="${ly+2*T}"/><rect class="pl-floor" x="0" y="0" width="${lx}" height="${ly}"/>`;

    const tc=plain?textOn(fillHex):'#14232B';
    const open=o.static?'<g>':`<g class="pl-g" data-act="pSel" data-r="${rc.r}" data-s="${rc.s}" tabindex="0" role="button" aria-label="${esc(it.name)}, ${it.W} mm">`;
    s+=open+`<rect class="${cls}"${fill} x="${rc.x}" y="${rc.y}" width="${rc.w}" height="${rc.h}"/>`;
    if(!ref){

      else if(rc.wall==='S')fl=[rc.x,rc.y,rc.x+rc.w,rc.y];
      else if(rc.wall==='O')fl=[rc.x+rc.w,rc.y,rc.x+rc.w,rc.y+rc.h];
      else fl=[rc.x,rc.y,rc.x,rc.y+rc.h];
      s+=`<line class="pl-front" x1="${fl[0]}" y1="${fl[1]}" x2="${fl[2]}" y2="${fl[3]}"/>`;
    }
    const sym=plain?planSym(rc):'';
    s+=sym;
    if(Math.min(rc.w,rc.h)>=fs*1.6&&Math.max(rc.w,rc.h)>=fs*2.4){
      const cx=rc.x+rc.w/2,cy=rc.y+rc.h/2,sh=sym?0.3:0;
      const off=rc.wall==='N'?[0,-sh*rc.h]:rc.wall==='S'?[0,sh*rc.h]:rc.wall==='O'?[-sh*rc.w,0]:[sh*rc.w,0];

      s+=`<text text-anchor="middle" font-weight="600" fill="${tc}" style="fill:${tc}" font-size="${Math.round(fs*.85)}" x="${+(cx+off[0]).toFixed(1)}" y="${+(cy+off[1]).toFixed(1)}">${esc(name)}</text>`;
      s+=`<text text-anchor="middle" fill="${tc}" style="fill:${tc}" font-size="${Math.round(fs*.7)}" x="${+(cx+off[0]).toFixed(1)}" y="${+(cy+off[1]+fs*.95).toFixed(1)}">${it.W}</text>`;
    }

  });
  if(o.aereos!==false)rects.forEach(rc=>{
    if(!rc.a)return;
    const ad=CFG.prof.aereo,aw=rc.a.W;
    const off=(rc.item.W-aw)/2;
    let x,y,w,h;

    else if(rc.wall==='S'){x=rc.x+off;y=ly-ad;w=aw;h=ad;}
    else if(rc.wall==='O'){x=0;y=rc.y+off;w=ad;h=aw;}
    else{x=lx-ad;y=rc.y+off;w=ad;h=aw;}
    s+=`<rect class="pl-aer" x="${x}" y="${y}" width="${w}" height="${h}"/>`;
    if(REC().led&&rc.a.fam!=='CM'&&rc.a.fam!=='ML'){
      let l;
      if(rc.wall==='N')l=[x,y+h,x+w,y+h];else if(rc.wall==='S')l=[x,y,x+w,y];else if(rc.wall==='O')l=[x+w,y,x+w,y+h];else l=[x,y,x,y+h];
      s+=`<line class="pl-led" x1="${l[0]}" y1="${l[1]}" x2="${l[2]}" y2="${l[3]}"/>`;
    }

  const T2=120,cfs=Math.round(fs*.8),ch={N:[],S:[],O:[],E:[]};
  rects.forEach(rc=>{const a=(rc.wall==='N'||rc.wall==='S')?[rc.x,rc.x+rc.w]:[rc.y,rc.y+rc.h];ch[rc.wall].push([a[0],a[1],rc.item.W]);});

  ch.S.forEach(g=>{s+=dimSegH(g[0],g[1],ly+T2+fs*1.8,g[2],cfs,false);});
  ch.O.forEach(g=>{s+=dimSegV(-T2-fs*1.8,g[0],g[1],g[2],cfs);});
  ch.E.forEach(g=>{s+=dimSegV(lx+T2+fs*2.6,g[0],g[1],g[2],cfs);});

  if(REC().led)s+=`<line class="pl-led" x1="1400" y1="${sy}" x2="1900" y2="${sy}"/><text x="1940" y="${sy+fs*.3}" font-size="${Math.round(fs*.75)}" class="dr-lbl" style="fill:var(--ink2)">Luz LED</text>`;
  return s+'</svg>';
}

/* ================= arrastrar muebles en la planta ================= */
let DRAG=null,SUPPRESS=false;
function runStart(r,ri,hasN){
  const w=wallOf(r,ri);
  return (r.off!=null&&r.off!=='')?+r.off:((w==='O'||w==='E')&&hasN?CFG.prof.base:0);
}
function dropTarget(pt){
  const room=K.room;if(!room||!pt)return null;
  if(pt.x<-800||pt.y<-800||pt.x>room.lx+800||pt.y>room.ly+800)return null;
  const dist={N:pt.y,S:room.ly-pt.y,O:pt.x,E:room.lx-pt.x};
  let w='N',best=Infinity;
  for(const k of ['N','S','O','E'])if(dist[k]<best){best=dist[k];w=k;}
  const along=(w==='N'||w==='S')?pt.x:pt.y;
  const run=K.runs.findIndex((r,i)=>wallOf(r,i)===w);
  return {wall:w,run,along};
}
function insertIndex(target,skip){
  if(target.run<0)return {idx:0,pos:0};
  const hasN=K.runs.some((r,i)=>wallOf(r,i)==='N');
  const r=K.runs[target.run];
  let acc=runStart(r,target.run,hasN);
  let idx=0;
  for(let i=0;i<r.slots.length;i++){
    if(skip&&skip.r===target.run&&skip.s===i)continue;
    const b=getItem(r.slots[i].b);const bw=b?b.W:0;
    if(target.along<acc+bw/2)return {idx,pos:acc};
    acc+=bw;idx++;
  }
  return {idx,pos:acc};
}
function commitDrop(drag,target){
  const room=K.room;if(!room||!target)return false;
  let ri=target.run;
  const skip=drag.kind==='move'?{r:drag.r,s:drag.s}:null;
  const at=insertIndex(target,skip);
  let slot;
  if(drag.kind==='move'){
    const src=K.runs[drag.r];if(!src||!src.slots[drag.s])return false;
    slot=src.slots.splice(drag.s,1)[0];
  }else slot={b:drag.code,a:null};
  if(ri<0){
    const len=(target.wall==='N'||target.wall==='S')?room.lx:Math.max(600,room.ly-CFG.prof.base);
    K.runs.push({label:'Muro '+String.fromCharCode(65+K.runs.length),length:len,slots:[],wall:target.wall});
    ri=K.runs.length-1;
  }
  K.runs[ri].slots.splice(at.idx,0,slot);
  S.pSel={r:ri,s:at.idx};
  return true;
}
function svgPt(svg,ev){
  const m=svg&&svg.getScreenCTM&&svg.getScreenCTM();if(!m)return null;
  const p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;
  const q=p.matrixTransform(m.inverse());return {x:q.x,y:q.y};
}
function dragLabel(){
  if(!DRAG)return '';
  if(DRAG.kind==='move'){const sl=K.runs[DRAG.r]&&K.runs[DRAG.r].slots[DRAG.s];const m=sl&&getItem(sl.b);return m?(m.code.replace(/-H\d\d|-T210/,'')):'Módulo';}
  return DRAG.label||DRAG.code;
}
function clearDragUI(){
  const g=document.getElementById('ghost');if(g)g.remove();
  const i=document.getElementById('pl-ind');if(i)i.remove();
  const bn=document.getElementById('pl-band');if(bn)bn.remove();
  const tr=document.getElementById('trash');if(tr)tr.classList.remove('over');
  document.querySelectorAll('.pl-drag').forEach(x=>x.classList.remove('pl-drag'));
}
function overTrash(e){
  const el=document.elementFromPoint?document.elementFromPoint(e.clientX,e.clientY):null;
  return !!(el&&el.closest&&el.closest('#trash'));
}
function updateDragUI(e){
  let gh=document.getElementById('ghost');
  if(!gh){gh=document.createElement('div');gh.id='ghost';gh.className='ghost';gh.textContent=dragLabel();document.body.appendChild(gh);}
  gh.style.left=(e.clientX+12)+'px';gh.style.top=(e.clientY+12)+'px';
  const svg=document.querySelector('svg.pl');
  let ind=document.getElementById('pl-ind'),band=document.getElementById('pl-band');
  const trEl=document.getElementById('trash'),ot=DRAG.kind==='move'&&overTrash(e);
  if(trEl)trEl.classList.toggle('over',ot);
  const tg=(!ot&&svg)?dropTarget(svgPt(svg,e)):null;
  if(!tg){if(ind)ind.remove();if(band)band.remove();return ot?{trash:true}:null;}
  const room=K.room,D=CFG.prof.base,at=insertIndex(tg,DRAG.kind==='move'?{r:DRAG.r,s:DRAG.s}:null);
  const NS='http://www.w3.org/2000/svg';
  let a,bd;
  if(tg.wall==='N'){a=[at.pos,0,at.pos,D];bd=[0,0,room.lx,D];}
  else if(tg.wall==='S'){a=[at.pos,room.ly-D,at.pos,room.ly];bd=[0,room.ly-D,room.lx,D];}
  else if(tg.wall==='O'){a=[0,at.pos,D,at.pos];bd=[0,0,D,room.ly];}
  else{a=[room.lx-D,at.pos,room.lx,at.pos];bd=[room.lx-D,0,D,room.ly];}
  if(!band){band=document.createElementNS(NS,'rect');band.setAttribute('id','pl-band');band.setAttribute('class','pl-band');svg.appendChild(band);}
  band.setAttribute('x',bd[0]);band.setAttribute('y',bd[1]);band.setAttribute('width',bd[2]);band.setAttribute('height',bd[3]);
  if(!ind){ind=document.createElementNS(NS,'line');ind.setAttribute('id','pl-ind');ind.setAttribute('class','pl-ind');svg.appendChild(ind);}
  ind.setAttribute('x1',a[0]);ind.setAttribute('y1',a[1]);ind.setAttribute('x2',a[2]);ind.setAttribute('y2',a[3]);
  return tg;
}
document.addEventListener('pointerdown',e=>{
  if(e.button>0||!e.target.closest)return;
  const pal=e.target.closest('.pal-item'),g=e.target.closest('g.pl-g');
  if(!pal&&!g)return;
  DRAG={kind:pal?'new':'move',code:pal?pal.dataset.code:null,label:pal?pal.dataset.label:null,r:g?+g.dataset.r:0,s:g?+g.dataset.s:0,x0:e.clientX,y0:e.clientY,moved:false};
});
window.addEventListener('pointermove',e=>{
  if(!DRAG)return;
  if(!DRAG.moved){
    if(Math.hypot(e.clientX-DRAG.x0,e.clientY-DRAG.y0)<7)return;
    DRAG.moved=true;
    if(DRAG.kind==='move'){const el=document.querySelector(`g.pl-g[data-r="${DRAG.r}"][data-s="${DRAG.s}"]`);if(el)el.classList.add('pl-drag');}
  }
  e.preventDefault&&e.preventDefault();
  updateDragUI(e);
});
window.addEventListener('pointerup',e=>{
  if(!DRAG)return;
  const d=DRAG;DRAG=null;
  if(!d.moved)return;
  SUPPRESS=true;setTimeout(()=>{SUPPRESS=false;},0);
  const svg=document.querySelector('svg.pl');
  const trash=d.kind==='move'&&overTrash(e);
  const tg=(!trash&&svg)?dropTarget(svgPt(svg,e)):null;
  clearDragUI();
  if(trash){
    const src=K.runs[d.r];
    if(src&&src.slots[d.s]){src.slots.splice(d.s,1);S.pSel=null;save();render();}
    return;
  }
  if(tg&&commitDrop(d,tg)){save();render();}
});
window.addEventListener('pointercancel',()=>{if(DRAG){DRAG=null;clearDragUI();}});

function remapVariant(code,v){
  const p=code.split('-');
  if(p.length!==3||!/^H[0-9]+$/.test(p[2]))return code;
  const nc=p[0]+'-'+p[1]+'-'+v;
  return (BY[nc]||p[0]==='RL')?nc:code;
}
function baseChanged(){
  CFG.bases=[...new Set((CFG.bases||[]).map(h=>Math.round(h/10)*10).filter(h=>h>=600&&h<=1100))].sort((a,b)=>a-b);
  if(!CFG.bases.length)CFG.bases=[700,800];
  rebuild();

  if(!ks.includes(K.variant)){const nv=ks[0];K.runs.forEach(r=>r.slots.forEach(sl=>{sl.b=remapVariant(sl.b,nv);}));K.variant=nv;}
  if(!ks.includes(G.v))G.v=ks[0];
  if(S.sys!=='ALL'&&!ks.includes(S.sys))S.sys=ks[0];
  if(S.catSys!=='ALL'&&!ks.includes(S.catSys))S.catSys=ks[0];
  PROPS=[];save();cloudSaveConfig();render();
}

    CLOUD_MSG=r.error?'Error al crear la cuenta: '+errMsg(r.error):(r.data&&r.data.session?'':'Revisa tu correo para confirmar la cuenta.');
    if(!r.error&&r.data&&r.data.session&&(!USER||USER.id!==r.data.session.user.id)){USER=r.data.session.user;await cloudLoad();return;}
    render();
  },
  logout:async()=>{await SB.auth.signOut();USER=null;SAVED=[];CUR_ID=null;CLOUD_MSG='';render();},
  cloudSave:()=>{cloudSaveKitchen();},
  cloudOpen:d=>{cloudOpen(d.id);},
  cloudDel:d=>{if(confirm('¿Eliminar esta cocina guardada?'))cloudDelete(d.id);},
  newK:()=>{K={variant:K.variant,ivaOn:K.ivaOn,rec:K.rec,runs:[{label:'Muro A',length:3200,slots:[]}]};S.pSel=null;K_NAME='';K_CLIENT='';CUR_ID=null;CLOUD_MSG='';save();render();},
  dlBudget:()=>{download('presupuesto-'+slug(K_NAME)+'.csv',csv(modsRows()),'text/csv;charset=utf-8',true);},
  dlCut:()=>{download('lista-de-corte-'+slug(K_NAME)+'.csv',csv(cutRows(K)),'text/csv;charset=utf-8',true);},
  dlJson:()=>{download('cocina-'+slug(K_NAME)+'.json',JSON.stringify({nombre:K_NAME,cliente:K_CLIENT,cocina:K,totales:kitchenTotals(K)},null,2),'application/json',false);}
};
const BIND={
  cdF:el=>{
    const d=CUSTOM.find(x=>x.id===DSEL);if(!d)return;
    const f=el.dataset.f;
    if(f==='code'){
      const c=String(el.value||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,3);
      if(c.length<2){CD_MSG='El código necesita 2 o 3 letras o números.';render();return;}
      if((FAM[c]&&!FAM[c].custom)||CUSTOM.some(x=>x.id!==d.id&&x.code===c)){CD_MSG='El código '+c+' ya existe. Elige otro.';render();return;}
      const old=d.code;d.code=c;CD_MSG='';
      RULES&&Object.values(RULES.tipos).forEach(T=>T.muros.forEach(m=>m.items.forEach(it=>{if(it.fams)it.fams=it.fams.map(x=>x===old?c:x);})));
      custChanged();return;
    }
    if(['prof','luzBorde','luzEntre','esp','divVert','zoc'].includes(f)){d[f]=el.value===''?'':(parseFloat(el.value)||0);}
    else d[f]=el.value;
    if(f==='nombre'&&!String(el.value).trim())d.nombre=d.code;
    custChanged();
  },
  openSym:el=>{CFG.openSym=el.value;save();cloudSaveConfig();render();},
  baseH:el=>{const i=+el.dataset.i;CFG.bases=(CFG.bases||[700,800]).slice();CFG.bases[i]=parseInt(el.value,10)||CFG.bases[i];baseChanged();},
  rec:el=>{REC();K.rec[el.dataset.k]=parseFloat(el.value)||0;save();render();},
  recChk:el=>{REC();K.rec[el.dataset.k]=el.checked;save();render();},
  recCielo:el=>{REC();K.rec.cielo=el.value==='1';save();render();},
  railOri:el=>{CFG.railOri=el.value;rebuild();save();cloudSaveConfig();render();},
  cdMat:el=>{const d=CUSTOM.find(x=>x.id===DSEL);if(!d)return;d[el.dataset.f]=el.value;custChanged();},
  cdChk:el=>{const d=CUSTOM.find(x=>x.id===DSEL);if(!d)return;d[el.dataset.f]=(el.dataset.f==='patas')?el.checked:el.checked;custChanged();},
  cdKind:el=>{
    const d=CUSTOM.find(x=>x.id===DSEL);if(!d)return;
    d.kind=el.value;d.vars=defaultVars(d.kind);d.techo=d.kind==='base'?'':'panel';custChanged();
  },
  cdVar:el=>{
    const d=CUSTOM.find(x=>x.id===DSEL);if(!d)return;
    let a=(d.vars&&d.vars.length?d.vars:defaultVars(d.kind)).slice();
    if(el.checked){if(!a.includes(el.dataset.v))a.push(el.dataset.v);}else{if(a.length<=1){render();return;}a=a.filter(x=>x!==el.dataset.v);}
    d.vars=a;custChanged();
  },
  cdW:el=>{
    const d=CUSTOM.find(x=>x.id===DSEL);if(!d)return;
    const w=+el.dataset.w;let a=(d.widths||[]).slice();
    if(el.checked){if(!a.includes(w))a.push(w);}else{if(a.length<=1){render();return;}a=a.filter(x=>x!==w);}
    d.widths=a.sort((x,y)=>x-y);custChanged();
  },
  ceT:el=>{
    const d=CUSTOM.find(x=>x.id===DSEL);if(!d)return;
    const i=+el.dataset.i,t=el.value;
    d.elementos[i]=t==='puerta'?{t:'puerta',h:0,hojas:'auto',apertura:'batiente',estantes:0}:t==='cajon'?{t:'cajon',h:200}:t==='nicho'?{t:'nicho',h:595,etiqueta:'Horno',anchoMin:560}:{t:'panel',h:80};
    custChanged();
  },
  ceF:el=>{
    const d=CUSTOM.find(x=>x.id===DSEL);if(!d)return;
    const e=d.elementos[+el.dataset.i],f=el.dataset.f;
    e[f]=['h','estantes','anchoMin','prof'].includes(f)?(parseFloat(el.value)||0):el.value;
    custChanged();
  },
  ceC:el=>{const d=CUSTOM.find(x=>x.id===DSEL);if(!d)return;d.elementos[+el.dataset.i][el.dataset.f]=el.checked;custChanged();},
  dPrev:el=>{S[el.dataset.k]=el.dataset.k==='dw'?+el.value:el.value;render();},
  roomDim:el=>{if(!K.room)K.room=roomDefaults();K.room[el.dataset.k]=Math.max(1200,parseInt(el.value,10)||1200);save();render();},
  pAer:el=>{S.pAer=el.checked;render();},
  runWall:el=>{K.runs[+el.dataset.r].wall=el.value;save();render();},
  runOff:el=>{const r=K.runs[+el.dataset.r];r.off=el.value===''?null:parseInt(el.value,10)||0;save();render();},
  abP:el=>{K.room.ab[+el.dataset.i].p=el.value;save();render();},
  abU:el=>{K.room.ab[+el.dataset.i].u=Math.max(0,parseInt(el.value,10)||0);save();render();},
  abA:el=>{K.room.ab[+el.dataset.i].a=Math.max(300,parseInt(el.value,10)||800);save();render();},
  rmPared:el=>{curT().muros[+el.dataset.m].pared=el.value;rulesChanged();},
  selMat:el=>{SEL.mat[el.dataset.k]=el.value;catChanged();},
  selCanto:el=>{SEL.canto[el.dataset.k]=el.value;catChanged();},
  selHerr:el=>{SEL.herr[el.dataset.t]=el.value;catChanged();},
  mQ:el=>{S.mq=el.value;render();},
  mFil:el=>{S[el.dataset.k]=el.value||(el.dataset.k==='mtipo'?'ALL':'');render();},
  dr:el=>{const f=el.dataset.f;if(!DRAFT)return;DRAFT[f]=['precio','largo','ancho','esp','holgura','descLargo','altoMax','descTrasera','espesor'].includes(f)?(parseFloat(el.value)||0):el.value;if(f==='tipo')render();},
  mImg:async el=>{
    const file=el.files&&el.files[0];if(!file||!DRAFT)return;
    try{const url=await fileToThumb(file,240);DRAFT.img=await storeImage(url,DRAFT.id);}
    catch(e){CAT_MSG='No se pudo cargar la imagen: '+errMsg(e);}
    render();
  },
  rtSel:el=>{S.rt=el.value;render();},
  rtName:el=>{curT().nombre=el.value||'Sin nombre';rulesChanged();},
  rmName:el=>{curT().muros[+el.dataset.m].nombre=el.value||'Muro';rulesChanged();},
  rmDesc:el=>{curT().muros[+el.dataset.m].desc=el.checked?1:0;rulesChanged();},
  riK:el=>{const T=curT(),mu=T.muros[+el.dataset.m],k=el.value;mu.items[+el.dataset.i]=k==='MOD'?{k:'MOD',fams:['BA'],pref:600,req:true}:k==='FILL'?{k:'FILL',peso:50}:{k:'REF'};rulesChanged();},
  riFam:el=>{
    const it=curT().muros[+el.dataset.m].items[+el.dataset.i],n=+el.dataset.n,f=it.fams.slice();
    if(n===0)f[0]=el.value;else if(el.value)f[1]=el.value;else f.length=1;
    if(f[1]&&f[1]===f[0])f.length=1;
    it.fams=f;it.pref=closest(FAM[f[0]].widths,it.pref||600);rulesChanged();
  },
  riPref:el=>{curT().muros[+el.dataset.m].items[+el.dataset.i].pref=+el.value;rulesChanged();},
  riPeso:el=>{curT().muros[+el.dataset.m].items[+el.dataset.i].peso=Math.max(1,+el.value||1);rulesChanged();},
  riReq:el=>{curT().muros[+el.dataset.m].items[+el.dataset.i].req=el.checked;rulesChanged();},
  artInc:el=>{const a=(K.artefactos||[])[+el.dataset.i];if(a){a.incluir=el.checked;save();render();}},
  anToggle:el=>{
    const f=el.dataset.f,w=+el.dataset.w;let a=RULES.anchos[f].slice();
    if(el.checked){if(!a.includes(w))a.push(w);}
    else{if(a.length<=1){render();return;}a=a.filter(x=>x!==w);}
    RULES.anchos[f]=a.sort((x,y)=>x-y);rebuild();rulesChanged();
  },
  mecQ:el=>{S.mecQ=el.value;render();},
  mecGrid:el=>{S.mecGrid=el.checked;render();},
  mecSnap:el=>{S.mecSnap=el.checked;render();},
  mecF:el=>{
    const M=getItem(S.mecCode);if(!M||S.mecPart==null||S.mecSel==null)return;
    const key=M.code+'|'+S.mecPart;
    CFG.mecOverrides=CFG.mecOverrides||{};
    const cur=(CFG.mecOverrides[key]||partHoles(M,S.mecPart)).slice();
    const ho=Object.assign({},cur[S.mecSel]);
    const f=el.dataset.f;
    ho[f]=(f==='t')?el.value:(parseFloat(el.value)||0);
    cur[S.mecSel]=ho;CFG.mecOverrides[key]=cur;
    save();cloudSaveConfig();render();
  },
  libQ:el=>{S.libQ=el.value;render();},
  kname:el=>{K_NAME=el.value;save();},
  kclient:el=>{K_CLIENT=el.value;save();},
  spec:el=>{SPEC=Math.max(50,parseInt(el.value,10)||600);},
  gen:el=>{
    (S.acc||(S.acc={})).gen=true;
    const k=el.dataset.k;
    G[k]=(k==='tipo'||k==='v')?el.value:(parseInt(el.value,10)||0);
    PROPS=[];PROP_ERR='';
    save();render();
  },
  genL:el=>{G.L[+el.dataset.i]=Math.max(0,parseInt(el.value,10)||0);save();},
  genChk:el=>{(S.acc||(S.acc={})).gen=true;G[el.dataset.k]=el.checked;save();render();},
  ivaOn:el=>{K.ivaOn=el.checked;save();render();},
  runLen:el=>{K.runs[+el.dataset.r].length=Math.max(600,parseInt(el.value,10)||600);save();render();},
  slotBase:el=>{snap();K.runs[+el.dataset.r].slots[+el.dataset.s].b=el.value;const s=K.runs[+el.dataset.r].slots[+el.dataset.s];const b=getItem(s.b),a=getItem(s.a);if(a&&(!b||a.W!==b.W))s.a=null;save();render();},
  slotAereo:el=>{K.runs[+el.dataset.r].slots[+el.dataset.s].a=el.value||null;save();render();},
  catPrices:el=>{S.catPrices=el.checked;render();},
  path:el=>{
    const sc=+el.dataset.sc||1,val=parseFloat(el.value);
    if(isNaN(val))return;
    setPath(el.dataset.path,val/sc);
    if(el.dataset.path.startsWith('CFG'))rebuild();
    save();cloudSaveConfig();render();
  }
};
document.addEventListener('click',e=>{
  if(SUPPRESS){SUPPRESS=false;return;}
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  if(ACT[el.dataset.act])ACT[el.dataset.act](el.dataset,e);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches&&e.target.matches('tr[data-act],g[data-act]'))ACT[e.target.dataset.act](e.target.dataset,e);
  if(e.key==='Enter'&&e.target.id==='pw')ACT.login();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.ovl){ACT.ovlClose();return;}
  if(S.ovl)return;
  if(S.tab!=='cocina'&&S.tab!=='planta')return;
  const tg=e.target;
  if(tg&&/^(INPUT|SELECT|TEXTAREA)$/.test(tg.tagName))return;
  if(!S.pSel)return;
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();ACT.delSel();}
  else if(e.key==='r'||e.key==='R'){ACT.rotSel();}
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-bind]');if(!el)return;
  if(BIND[el.dataset.bind])BIND[el.dataset.bind](el);
});
window.addEventListener('afterprint',()=>{document.getElementById('printRoot').innerHTML='';});
window.addEventListener('resize',()=>{measureHead();});
let FDRAG=null;
document.addEventListener('pointerdown',e=>{
  if(e.button>0||!e.target.closest)return;
  const h=e.target.closest('.fpanel-h');
  if(!h||e.target.closest('button'))return;
  const panel=h.closest('.fpanel');if(!panel)return;
  const r=panel.getBoundingClientRect();
  FDRAG={key:h.dataset.drag,dx:e.clientX-r.left,dy:e.clientY-r.top};
  panel.style.zIndex=50;
});
window.addEventListener('pointermove',e=>{
  if(!FDRAG)return;
  const panel=document.getElementById('fp-'+FDRAG.key);if(!panel)return;
  e.preventDefault&&e.preventDefault();
  const x=Math.max(4,Math.min(window.innerWidth-60,e.clientX-FDRAG.dx)),y=Math.max(4,Math.min(window.innerHeight-40,e.clientY-FDRAG.dy));
  panel.style.left=x+'px';panel.style.top=y+'px';
  const st=S.float&&S.float[FDRAG.key];if(st){st.x=x;st.y=y;}
});
window.addEventListener('pointerup',()=>{FDRAG=null;});
let MDRAG=null;
document.addEventListener('pointerdown',e=>{
  const g=e.target.closest('.mec-h');if(!g)return;
  const svg=g.closest('svg.mec');if(!svg)return;
  S.mecSel=+g.dataset.i;
  MDRAG={idx:+g.dataset.i,svg,g};
});
window.addEventListener('pointermove',e=>{
  if(!MDRAG)return;
  const pt=svgPt(MDRAG.svg,e);if(!pt)return;
  e.preventDefault&&e.preventDefault();
  let x=Math.round(pt.x),y=Math.round(pt.y);
  if(S.mecSnap){x=Math.round(x/32)*32;y=Math.round(y/32)*32;}
  MDRAG.g.querySelectorAll('circle,line').forEach(el=>{
    if(el.tagName==='circle'){el.setAttribute('cx',x);el.setAttribute('cy',y);}
  });
  MDRAG.x=x;MDRAG.y=y;
});
window.addEventListener('pointerup',()=>{
  if(!MDRAG){return;}
  if(MDRAG.x!=null){
    const M=getItem(S.mecCode);
    if(M&&S.mecPart!=null){
      const key=M.code+'|'+S.mecPart;
      CFG.mecOverrides=CFG.mecOverrides||{};
      const cur=(CFG.mecOverrides[key]||partHoles(M,S.mecPart)).slice();
      if(cur[MDRAG.idx]){cur[MDRAG.idx]=Object.assign({},cur[MDRAG.idx],{x:MDRAG.x,y:MDRAG.y});CFG.mecOverrides[key]=cur;save();cloudSaveConfig();render();}
    }
  }
  MDRAG=null;
});

load();rebuild();
if(K.runs.length===0)K.runs=[{label:'Muro A',length:3200,slots:[]}];
render();
cloudInit();
</script>
</body>
